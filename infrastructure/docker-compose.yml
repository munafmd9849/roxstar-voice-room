services:
  postgres:
    image: postgres:16-alpine
    container_name: roxstar-postgres
    environment:
      POSTGRES_DB: roxstar
      POSTGRES_USER: roxstar
      POSTGRES_PASSWORD: roxstar_local_dev
    ports:
      - "5432:5432"
    volumes:
      - roxstar_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roxstar -d roxstar"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  roxstar_postgres_data:

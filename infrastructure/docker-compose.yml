services:
  postgres:
    image: postgres:16-alpine
    container_name: roxstar-postgres
    environment:
      POSTGRES_DB: roxstar
      POSTGRES_USER: roxstar
      POSTGRES_PASSWORD: roxstar_local_dev
    ports:
      - "5432:5432"
    volumes:
      - roxstar_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roxstar -d roxstar"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: roxstar-backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://roxstar:roxstar_local_dev@postgres:5432/roxstar?schema=public
      PORT: 3000
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  roxstar_postgres_data:
